<script>
  // Fonts draw onto canvas, so wait for them before building the first arena.
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise((r) => setTimeout(r, 2500))]).then(() => BW.UI.menu());
</script>
